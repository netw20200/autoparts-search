<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoParts Search</title>
  
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="style.css">
  <style>
body,h1 {font-family: "Raleway", sans-serif}
body, html {height: 100%}
.bgimg {
  background-image: url('https://netw20200.github.io/autoparts-search/images/1111.jpeg');
  min-height: 100%;
  background-position: center;
  background-size: cover;
}
  </style>
</head>
<body class="bgimg">

<header class="w3-bar w3-padding"
style="background:rgba(0,0,0,0.45); display:flex; align-items:center;">

    <img src="images/logo.png"
         alt="Logo"
         style="height:60px; margin-right:15px;">

    <h2 style="
        margin:0;
        color:#ff2b2b;
        font-weight:bold;
        font-size:16px;">
        AutoParts Search
    </h2>

</header>
<div id="message"
style="
display:none;
max-width:700px;
margin:15px auto;
padding:15px;
background:#4CAF50;
color:white;
border-radius:10px;
text-align:center;
font-weight:bold;">
</div>
<div class="search">

<input
type="text"
id="searchInput"
placeholder="Введите каталожный номер">

<button id="searchButton">
Найти
</button>

</div>

<div id="result">
Загрузка товаров...
</div>

<div id="cart"
class="w3-card w3-white w3-round-large w3-padding"
style="max-width:700px;margin:20px auto;display:none;">

<h3>🛒 Корзина</h3>

<div id="cartItems"></div>

<hr>

<p><b>Итого:</b> <span id="cartTotal">0</span> грн</p>

<button id="checkoutButton"
class="w3-button w3-green w3-round-large"
onclick="goToCheckout()">
Оформить заказ
</button>

</div>
  <div id="orderForm"
class="w3-card w3-white w3-round-large w3-padding"
style="max-width:700px;margin:20px auto;display:none;">

<h3>Оформление заказа</h3>

<input class="w3-input w3-border w3-round"
id="customerName"
placeholder="Ваше имя">

<br>

<input class="w3-input w3-border w3-round"
id="customerPhone"
placeholder="Телефон">

<br>

<textarea class="w3-input w3-border w3-round"
id="customerComment"
placeholder="Комментарий"></textarea>

<br>

<button
class="w3-button w3-green w3-round-large"
onclick="goToCheckout()">
Оформить заказ
</button>

  </div>



  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
emailjs.init({
    publicKey: "NZE-dG86G7WYYz874",
});
</script>
<script src="script.js"></script>

</body>
</html>
