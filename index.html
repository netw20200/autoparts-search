<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoParts Search</title>
  
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="style.css">
  <style>
body,h1 {font-family: "Raleway", sans-serif}
body, html {height: 100%}
.bgimg {
  background-image: url('https://netw20200.github.io/autoparts-search/images/1111.jpeg');
  min-height: 100%;
  background-position: center;
  background-size: cover;
}
  </style>
</head>
<body class="bgimg">

<header class="w3-bar w3-black w3-padding">

    <img src="images/logo.png"
         alt="Logo"
         style="height:60px"
         class="w3-bar-item">

    <div class="w3-bar-item">
        <h2 style="margin:0">AutoParts Search</h2>
        <small>Поиск автозапчастей</small>
    </div>

</header>

<div class="search">

<input
type="text"
id="searchInput"
placeholder="Введите каталожный номер">

<button id="searchButton">
Найти
</button>

</div>

<div id="result">
Загрузка товаров...
</div>

<footer>

<p>Телефон</p>


</footer>

<script src="script.js"></script>

</body>
</html>
