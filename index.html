<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoParts Search</title>

  
<meta name="description" content="Поиск автозапчастей по каталожному номеру, подбор по VIN, аксессуары для автомобиля.">
<meta property="og:title" content="AutoParts Search">
<meta property="og:description" content="Поиск автозапчастей, подбор по VIN, оформление заказа онлайн.">
<meta property="og:image" content="https://netw20200.github.io/autoparts-search/images/logo.png">
<meta property="og:url" content="https://netw20200.github.io/autoparts-search/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="AutoParts Search">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="style.css">
  <style>

body, html {height: 100%}
.bgimg {
  background-image: url('https://netw20200.github.io/autoparts-search/images/1111.jpeg');
  min-height: 100%;
  background-position: center;
  background-size: cover;
}
  </style>
</head>
<body class="bgimg">

<header class="site-header">

    <div class="header-logo">
        <img id="shopLogo" alt="Logo">
    </div>

    <div class="header-title" id="shopName"></div>

    <div id="cartIcon" class="cart-icon">
        🛒
        <span id="cartCount">0</span>
    </div>

</header>
<div style="text-align:center;margin-bottom:15px;font-size:15px;">

<a href="#" onclick="setLanguage('ru')">RU</a>
&nbsp; | &nbsp;
<a href="#" onclick="setLanguage('ua')">UA</a>

</div>

  
<div id="message"
style="
display:none;
max-width:700px;
margin:15px auto;
padding:15px;
background:#4CAF50;
color:white;
border-radius:10px;
text-align:center;
font-weight:bold;">
</div>
  
<div class="search">

<input
type="text"
id="searchInput"
placeholder="Введите каталожный номер">

<span id="clearSearch">✖</span>

<button id="searchButton">
Найти
</button>

</div>

<div id="result">
Загрузка товаров...
</div>

  <div class="info-blocks">
<div class="w3-card w3-round-large"
style="
width:95%;
max-width:650px;
margin:20px auto;
padding:20px;
text-align:left;
background:rgba(255,255,255,0.72);
backdrop-filter:blur(2px);
">
  

<h2 id="vinTitle" style="margin:0 0 12px 0;font-size:20px;">
Подбор по VIN-коду
</h2>

<button
class="w3-button w3-red w3-round-large"
onclick="document.getElementById('vinForm').style.display='block'">

Запросить подбор

</button>

</div>

<div class="menu-block">
<div class="menu-links">
    <div><a href="sales.html" id="salesLink">• Акции</a></div>
<div><a href="accessories.html" id="accessoriesLink">• Аксессуары</a></div>
<div><a href="fluids.html" id="fluidsLink">• Жидкости</a></div>
  </div>
</div>
</div>
    
    <div id="cartOverlay" class="cart-overlay"></div>
<div id="cart"
class="w3-card w3-white w3-round-large w3-padding">

<h3>🛒 Корзина</h3>

<div id="cartItems"></div>

<hr>

<p><b>Итого:</b> <span id="cartTotal">0</span> грн</p>

<button id="checkoutButton"
class="w3-button w3-green w3-round-large"
onclick="openOrderForm()">
Оформить заказ
</button>

</div>
  <div id="orderForm"
class="w3-card w3-white w3-round-large w3-padding"
style="max-width:700px;margin:20px auto;display:none;">

<h3>Оформление заказа</h3>

<input class="w3-input w3-border w3-round"
id="customerName"
placeholder="Ваше имя">

<br>

<input class="w3-input w3-border w3-round"
id="customerPhone"
placeholder="Телефон">

<br>

<textarea class="w3-input w3-border w3-round"
id="customerComment"
placeholder="Комментарий"></textarea>

<br>

<button
class="w3-button w3-green w3-round-large"
  onclick="sendOrder()">
Подтвердить заказ
</button>

  </div>
  
<div id="vinForm"
style="display:none;position:fixed;left:0;top:0;width:100%;height:100%;
background:rgba(0,0,0,.5);z-index:9999;">

<div class="w3-card w3-white w3-round-large"
style="max-width:500px;margin:50px auto;padding:20px;">

<h3>Подбор по VIN-коду</h3>

<input id="vinCode"
class="w3-input w3-border w3-margin-bottom"
placeholder="VIN автомобиля">

<input id="vinPart"
class="w3-input w3-border w3-margin-bottom"
placeholder="Что требуется подобрать?">

<input id="vinName"
class="w3-input w3-border w3-margin-bottom"
placeholder="Ваше имя">

<input id="vinPhone"
class="w3-input w3-border w3-margin-bottom"
placeholder="Телефон">

<input id="vinEmail"
class="w3-input w3-border w3-margin-bottom"
placeholder="Email">

<textarea id="vinComment"
class="w3-input w3-border w3-margin-bottom"
placeholder="Комментарий (необязательно)"
style="height:90px;"></textarea>

<div style="display:flex;gap:10px;justify-content:flex-end;">

<button
class="w3-button w3-gray w3-round"
onclick="document.getElementById('vinForm').style.display='none'">
Отмена
</button>

<button
class="w3-button w3-green w3-round"
onclick="sendVinRequest()">
Отправить запрос
</button>
</div>
</div>
</div>                       
<footer class="site-footer">
    📞 Телефон: <a href="tel:111111111"><span id="shopPhone"></span></a>


</footer>
  
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="config.js"></script>
<script>
emailjs.init({
    publicKey: CONFIG.EMAILJS_PUBLIC_KEY,
});
</script>
  
  <script src="lang/ru.js"></script>
<script src="lang/ua.js"></script>
<script src="script.js"></script>

</body>
</html>
