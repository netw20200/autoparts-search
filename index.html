<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoParts Search</title>
  
<link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
<link rel="stylesheet" href="style.css">
  <style>
body,h1 {font-family: "Raleway", sans-serif}
body, html {height: 100%}
.bgimg {
  background-image: url('https://netw20200.github.io/autoparts-search/images/1111.jpeg');
  min-height: 100%;
  background-position: center;
  background-size: cover;
}
  </style>
</head>
<body class="bgimg">

<header class="w3-bar w3-padding"
style="background:rgba(0,0,0,0.45); display:flex; align-items:center;">

         alt="Logo"
         style="height:60px; margin-right:15px;">

    <h2 style="
        margin:0;
        color:#ff2b2b;
        font-weight:bold;
        font-size:32px;">

    </h2>

<div class="search">

type="text"
id="searchInput"
placeholder="Введите каталожный номер">

</button>

</div>

<div id="result">
Загрузка товаров...
</div>

<footer>

</html>
